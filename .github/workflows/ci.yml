name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The full set nightly on main, beside every push to it: a pull request
  # skips the slow tests its change cannot reach (scripts/ci-gate.sh).
  schedule:
    - cron: '41 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Repository hygiene
        run: bash scripts/check-repo.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: true
      # A copied example must name commands, flags, routes and builtins
      # that exist (docs/DEVELOPMENT.md, "Examples in the documentation").
      - name: no stale names in the docs' examples
        run: sh scripts/check-doc-examples.sh

  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not gofmt'd:"; echo "$out"; exit 1; fi
      - name: go mod verify
        run: go mod verify
      - name: go mod tidy check
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: go vet (the real-aimem harness, behind its build tag)
        run: GOOS=linux go vet -tags realaimem ./e2e/...

  go-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # On a pull request the Windows tests run only when the change can
      # reach them; the job then passes with its steps skipped.
      - name: gate
        id: gate
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then bash scripts/ci-gate.sh windows
          else echo "run=true" >>"$GITHUB_OUTPUT"; fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.gate.outputs.run == 'true'
        with:
          go-version: '1.25'
          cache: true
      - run: go test -count=1 ./...
        if: steps.gate.outputs.run == 'true'
      # A member's service against the runner's real service manager
      # (launchd, the task scheduler, systemd's user manager): install,
      # run, stop, start, uninstall. The test skips where the runner has no
      # login session or user manager, and says so.
      - name: real user service
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 10
        env:
          AICREW_REAL_SERVICE: '1'
        run: go test -count=1 -v -run TestRealService ./internal/service/

  # The race detector checks, on one OS, the packages whose goroutines
  # share state: the launcher's step channel reads the engine's session
  # state (agent), and the server's handlers, reconciler and logging run
  # store commands concurrently (server, store). It is its own job, one per
  # package in parallel, so the go-test results do not wait for it and its
  # wall time is the slowest package's, not the sum. On a pull request a
  # package runs only when the change touches it or a package its tests
  # import; the job then passes with the test step skipped.
  go-race:
    strategy:
      fail-fast: false
      matrix:
        pkg: [agent, server, store]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: true
      - name: gate
        id: gate
        run: bash scripts/ci-gate.sh race ${{ matrix.pkg }}
      - name: go test -race (${{ matrix.pkg }})
        if: steps.gate.outputs.run == 'true'
        run: go test -race -count=1 -timeout 20m ./internal/${{ matrix.pkg }}/

  go-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: true
      - name: Build with CGO disabled
        run: CGO_ENABLED=0 go build ./...

  # The release workflow's build on every change, publishing nothing: the
  # cross-build of every release asset, SHA256SUMS and the stamped version,
  # then the verification command DEVELOPMENT ("Releasing") gives for each
  # platform, run on that platform, and the release script's refusals.
  release-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: true
      - name: Release build (uploads nothing)
        shell: bash
        run: bash scripts/release.sh build v0.0.0
      - name: Verify the sums (Linux)
        if: runner.os == 'Linux'
        working-directory: dist
        run: sha256sum --ignore-missing -c SHA256SUMS
      - name: Verify the sums (macOS)
        if: runner.os == 'macOS'
        working-directory: dist
        run: shasum -a 256 --ignore-missing -c SHA256SUMS
      - name: Verify the sums (Windows)
        if: runner.os == 'Windows'
        working-directory: dist
        shell: pwsh
        run: |
          Get-ChildItem -File | Where-Object Name -ne 'SHA256SUMS' | ForEach-Object {
            $h = (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower()
            if (-not (Select-String -Path SHA256SUMS -Pattern "^$h\s+$([regex]::Escape($_.Name))$" -Quiet)) { throw "checksum mismatch: $($_.Name)" }
          }
          'all sums match'
      - name: Release script refusals
        if: runner.os == 'Linux'
        run: bash scripts/release_test.sh
