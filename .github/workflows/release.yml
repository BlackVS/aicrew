name: Release

# A release is a vX.Y.Z tag on a commit of main, pushed by the operator:
#   git tag -a vX.Y.Z origin/main -m "aicrew X.Y.Z" && git push origin vX.Y.Z
# The tag's CHANGELOG.md section must already be on main (the
# release-preparation PR writes it). This workflow never creates a tag.
#
# Run by hand, it either republishes an existing tag after a failed run, or,
# with dry_run (the default), builds, stamps and prints the sums of a tag
# that need not exist yet and publishes nothing:
#   gh workflow run release.yml --ref vX.Y.Z -f tag=vX.Y.Z -f dry_run=false
#   gh workflow run release.yml --ref main -f tag=vX.Y.Z
# A run that publishes starts from its tag, so it runs this workflow and
# scripts/release.sh as they are at the tag; a workflow broken at a tag is
# fixed in the next version. Only a dry run, started from main, checks out
# a commit that may predate the script.
#
# The jobs: `ref` refuses a manual run from the wrong ref before any runner
# builds. `build` checks out the commit, runs the guards, the tests and the
# build with read access only, and hands dist/ and the notes over as an
# artifact. `macos` tests and builds the same commit on macOS. `publish`
# holds the write permissions and the OIDC token the attestation is signed
# with; it checks out nothing and runs no code from the repository: it
# checks the files build handed over, attests them and creates the release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag, vX.Y.Z. It must exist unless dry_run is set.'
        required: true
      dry_run:
        description: 'Build, stamp and print the sums only; publish nothing'
        type: boolean
        default: true

permissions:
  contents: read

# One release at a time, so "latest" is decided after every earlier run.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The attestation names the ref and the commit the run started from, not
  # the ones it checked out: a manual run that publishes must start from its
  # tag. A dry run attests and publishes nothing and starts from main.
  # This job holds no permission and runs before any runner builds;
  # scripts/release.sh resolve applies the same rule again in build.
  ref:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: A manual run starts from its tag, or a dry run from main
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          t=$INPUT_TAG; [[ $t = v* ]] || t=v$t
          if [ "$INPUT_DRY_RUN" = true ]; then
            [ "$GITHUB_REF" = refs/heads/main ] && exit 0
            echo "::error::a dry run starts from main, not $GITHUB_REF: gh workflow run release.yml --ref main -f tag=$t"
            exit 1
          fi
          [ "$GITHUB_REF" = "refs/tags/$t" ] && exit 0
          echo "::error::this run started from $GITHUB_REF, not refs/tags/$t, and its attestation would name that ref. Start it from the tag: gh workflow run release.yml --ref $t -f tag=$t -f dry_run=false"
          exit 1

  # Everything that runs code from the repository runs here or in macos,
  # with read access only: the tests reach no token that writes and no
  # OIDC token to sign with.
  build:
    needs: ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.TAG }}
      dry_run: ${{ steps.resolve.outputs.DRY_RUN }}
      commit: ${{ steps.commit.outputs.COMMIT }}
      sums: ${{ steps.hand-over.outputs.sums }}
      notes: ${{ steps.hand-over.outputs.notes }}
    env:
      INPUT_TAG: ${{ inputs.tag }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history: the check needs merge-base and the tags
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: true
      # The check checks out the commit to release. On a dry run from main
      # that commit may predate the script (a run that publishes starts at
      # its tag, where the two are the same commit): every step runs the
      # copy from this workflow's commit.
      - name: Resolve the release
        id: resolve
        run: |
          cp scripts/release.sh "$RUNNER_TEMP/release.sh"
          bash "$RUNNER_TEMP/release.sh" resolve
      - name: Check the tag, main and the CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}   # read-only here: gh release view
          GH_REPO: ${{ github.repository }}
        run: bash "$RUNNER_TEMP/release.sh" check "$TAG" $([ "$DRY_RUN" = true ] && echo --dry-run)
      - name: The commit checked, for the macOS job
        id: commit
        run: echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Test before building
        run: go test -count=1 ./...
      - name: Build, stamp and sum
        run: bash "$RUNNER_TEMP/release.sh" build "$TAG"
      - name: Release notes
        run: |
          bash "$RUNNER_TEMP/release.sh" notes "$TAG" $([ "$DRY_RUN" = true ] && echo --dry-run)
          cat release_notes.md
      # The digests of SHA256SUMS and the notes leave this job as job
      # outputs, apart from the artifact: publish checks the artifact it
      # downloads against them, and SHA256SUMS then vouches for every other
      # file.
      - name: Hand over the digests
        id: hand-over
        run: |
          echo "sums=$(sha256sum dist/SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "notes=$(sha256sum release_notes.md | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Keep the assets for the publishing job
        if: env.DRY_RUN != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/
            release_notes.md
          retention-days: 1
          if-no-files-found: error

  # The same commit tested and built on macOS, the one place besides the
  # nightly CI run where the macOS legs run (DEVELOPMENT, "What runs
  # where"): a Mac-only failure stops the release. It publishes nothing; the
  # assets are the build job's.
  macos:
    needs: build
    runs-on: macos-latest
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      # On a dry run the commit may predate the script, as in the build
      # job: this workflow's copy runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .workflow
          persist-credentials: false
      - name: This workflow's release script
        run: |
          cp .workflow/scripts/release.sh "$RUNNER_TEMP/release.sh"
          rm -rf .workflow
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: true
      - name: Test
        run: go test -count=1 ./...
      - name: Build, stamp and sum
        run: bash "$RUNNER_TEMP/release.sh" build "$TAG"
      - name: Verify the sums
        working-directory: dist
        run: shasum -a 256 --ignore-missing -c SHA256SUMS

  publish:
    needs: [ref, build, macos]
    if: needs.build.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release and upload its assets
      id-token: write       # the OIDC token the attestation is signed with
      attestations: write   # store the attestation
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: SHA256SUMS and the notes are the ones build produced
        working-directory: release
        env:
          SUMS: ${{ needs.build.outputs.sums }}
          NOTES: ${{ needs.build.outputs.notes }}
        run: |
          printf '%s  %s\n' "$SUMS" dist/SHA256SUMS "$NOTES" release_notes.md | sha256sum -c --strict - ||
            { echo "::error::the downloaded SHA256SUMS or release notes are not the ones the build job produced"; exit 1; }

      - name: Every file matches SHA256SUMS
        working-directory: release/dist
        run: |
          sha256sum -c --strict SHA256SUMS ||
            { echo "::error::a file does not match its line in SHA256SUMS"; exit 1; }

      # sha256sum -c ignores a file SHA256SUMS does not list, and the steps
      # below attest and publish dist/*: the files must be exactly the ones
      # listed, nothing more and nothing missing.
      - name: dist holds exactly the files SHA256SUMS lists
        working-directory: release/dist
        run: |
          listed=$(sed 's/^[0-9a-f]\{64\} [ *]//' SHA256SUMS | LC_ALL=C sort)
          present=$(find . -mindepth 1 -maxdepth 1 ! -name SHA256SUMS -printf '%P\n' | LC_ALL=C sort)
          if [ "$listed" != "$present" ]; then
            echo "::error::the files handed over are not exactly the files SHA256SUMS lists"
            echo "listed only in SHA256SUMS:"; comm -23 <(printf '%s\n' "$listed") <(printf '%s\n' "$present")
            echo "present but not listed:"; comm -13 <(printf '%s\n' "$listed") <(printf '%s\n' "$present")
            exit 1
          fi

      # SHA256SUMS proves a download arrived intact, not who built it: one
      # who could change an asset could change the sums with it. The
      # attestation ties every published file, SHA256SUMS included, to this
      # workflow run at the tag's commit; gh attestation verify checks it.
      # Directly before the release step: every check has run, so no
      # attestation is stored for files that are never published, and a
      # failed attestation publishes nothing.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/dist/*

      # All assets in one step. A release is marked latest only when no
      # higher vX.Y.Z tag exists; the tags are read from the forge, since
      # this job has no checkout.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A failed read must not leave "latest" decided from nothing: with
          # pipefail a failing git ls-remote fails the read, and so does an
          # empty list (grep matches nothing), which is never right, since
          # the tag being published exists there.
          set -o pipefail
          newest=$(git ls-remote --tags --refs "https://github.com/$GH_REPO" 'v*' | sed 's|.*refs/tags/||' |
            grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n 1) ||
            { echo "::error::could not read the vX.Y.Z tags from the forge"; exit 1; }
          latest=false; [ "$newest" = "$TAG" ] && latest=true
          echo "newest tag on the forge: $newest; $TAG latest: $latest"
          gh release create "$TAG" release/dist/* --verify-tag --latest="$latest" \
            --title "aicrew ${TAG#v}" --notes-file release/release_notes.md
