# The pilot simulation's stack (docs/DESIGN-PILOT-SIMULATION.md, section 3;
# docs/E2E-PILOT-SIM.md). scripts/pilot-sim.sh stages the build contexts
# under PILOTSIM_STAGE and drives it; it is not meant for a bare
# `docker compose up`.
#
# Every service has a memory limit of at least twice its peak over full
# runs (docs/E2E-PILOT-SIM.md, "A dedicated host"); the members get more,
# since each turn runs git and verify-delivery.
name: pilotsim

x-member: &member
  build:
    context: ${PILOTSIM_STAGE:?run scripts/pilot-sim.sh}/member
    args:
      AIMEM_VERSION: ${PILOTSIM_AIMEM_VERSION:?}
      AISKILLS_VERSION: ${PILOTSIM_AISKILLS_VERSION:?}
      AISKILLS: oh-code-review,verify-delivery
  image: pilotsim-member
  mem_limit: 512m
  depends_on:
    sim-ca: {condition: service_completed_successfully}
    sim-px-aimem: {condition: service_healthy}
    sim-px-crew: {condition: service_healthy}
  environment:
    SSL_CERT_FILE: /sim/tls/ca.pem
  restart: "no"

x-stub: &stub
  build: ${PILOTSIM_STAGE:?}/stub
  image: pilotsim-stub
  mem_limit: 128m
  depends_on:
    sim-ca: {condition: service_completed_successfully}
  restart: "no"

# The fault proxies (DESIGN-PILOT-SIMULATION section 6.1), one per TLS
# boundary the cases fault: each presents its target's certificate and key
# and forwards to it. The runner arms them through `simproxy` in their
# containers; their control API listens on the container's loopback only.
x-proxy: &proxy
  build: ${PILOTSIM_STAGE:?}/proxy
  image: pilotsim-proxy
  mem_limit: 64m
  depends_on:
    sim-ca: {condition: service_completed_successfully}
  volumes: [tls:/sim/tls:ro]
  healthcheck:
    test: ["CMD", "simproxy", "log"]
    interval: 2s
    retries: 30
  restart: "no"

services:
  # The members' aimem to the hub. The members name it as their hub: the
  # hub's certificate carries sim-px-aimem as an alias.
  sim-px-aimem:
    <<: *proxy
    command: [-listen, ":8440", -cert, /sim/tls/sim-aimem.pem, -key, /sim/tls/sim-aimem.key, -target, "https://sim-aimem:8440"]

  # The members to aicrewd, which they pin by key; it keeps the coordination
  # proofs it sees for the secret scan (case F7).
  sim-px-crew:
    <<: *proxy
    command: [-listen, ":9443", -cert, /sim/tls/sim-aicrewd.pem, -key, /sim/tls/sim-aicrewd.key,
      -target, "https://sim-aicrewd:9443", -proofs, /var/lib/simproxy/proofs]

  # The hub to aicrewd: the peer endpoint the hub pins by key.
  sim-px-peer:
    <<: *proxy
    command: [-listen, ":9443", -cert, /sim/tls/sim-aicrewd.pem, -key, /sim/tls/sim-aicrewd.key, -target, "https://sim-aicrewd:9443"]

  sim-ca:
    build: ${PILOTSIM_STAGE:?}/ca
    mem_limit: 128m
    volumes: [tls:/sim/tls]

  sim-aimem:
    build: ${PILOTSIM_STAGE:?}/hub
    mem_limit: 256m
    depends_on:
      sim-ca: {condition: service_completed_successfully}
    volumes: [tls:/sim/tls:ro]
    environment:
      SSL_CERT_FILE: /sim/tls/ca.pem
      GIT_SSL_CAINFO: /sim/tls/ca.pem
    healthcheck:
      test: ["CMD", "curl", "-fs", "--cacert", "/sim/tls/ca.pem", "https://sim-aimem:8440/v1/status"]
      interval: 2s
      retries: 60

  sim-aicrewd:
    build: ${PILOTSIM_STAGE:?}/aicrewd
    mem_limit: 256m
    depends_on:
      sim-ca: {condition: service_completed_successfully}
    volumes: [tls:/sim/tls:ro]
    environment:
      SSL_CERT_FILE: /sim/tls/ca.pem
    healthcheck:
      test: ["CMD", "curl", "-fs", "--cacert", "/sim/tls/ca.pem", "https://sim-aicrewd:9443/healthz"]
      interval: 2s
      retries: 60

  sim-gitea:
    image: gitea/gitea:1.27.3@sha256:87a67ee09d3ae0d1df5fda5dcda3e2a1f9236a45b0a59025d6e00e46adc43bef
    mem_limit: 768m
    depends_on:
      sim-ca: {condition: service_completed_successfully}
    volumes: [tls:/sim/tls:ro]
    entrypoint:
      - /bin/sh
      - -c
      - >-
        install -d -o 1000 -g 1000 /data/tls &&
        install -o 1000 -g 1000 -m 644 /sim/tls/sim-gitea.pem /data/tls/cert.pem &&
        install -o 1000 -g 1000 -m 600 /sim/tls/sim-gitea.key /data/tls/key.pem &&
        exec /usr/bin/entrypoint
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__server__PROTOCOL: https
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__DOMAIN: sim-gitea
      GITEA__server__ROOT_URL: https://sim-gitea:3000/
      GITEA__server__CERT_FILE: /data/tls/cert.pem
      GITEA__server__KEY_FILE: /data/tls/key.pem
      GITEA__server__DISABLE_SSH: "true"
    healthcheck:
      test: ["CMD", "curl", "-fs", "--cacert", "/sim/tls/ca.pem", "https://sim-gitea:3000/api/healthz"]
      interval: 2s
      retries: 90

  sim-coordinator:
    <<: *member
    volumes: [tls:/sim/tls:ro, in-coordinator:/sim/in, scenario-coordinator:/sim/scenario]
    environment:
      SSL_CERT_FILE: /sim/tls/ca.pem
      GIT_SSL_CAINFO: /sim/tls/ca.pem
      SIM_ROLE: coordinator

  sim-worker:
    <<: *member
    volumes: [tls:/sim/tls:ro, in-worker:/sim/in, scenario-worker:/sim/scenario]
    environment:
      SSL_CERT_FILE: /sim/tls/ca.pem
      GIT_SSL_CAINFO: /sim/tls/ca.pem
      SIM_ROLE: worker

  # The stub reviewer and the stub CI (DESIGN-PILOT-SIMULATION section
  # 2.5): each reads its own forge token and the shared scenario file.
  sim-hands:
    <<: *stub
    volumes: [tls:/sim/tls:ro, in-hands:/sim/in, scenario:/sim/scenario]
    environment:
      SSL_CERT_FILE: /sim/tls/ca.pem
      SIM_STUB: hands

  sim-ci:
    <<: *stub
    volumes: [tls:/sim/tls:ro, in-ci:/sim/in, scenario:/sim/scenario]
    environment:
      SSL_CERT_FILE: /sim/tls/ca.pem
      SIM_STUB: ci

volumes:
  tls:
  in-coordinator:
  in-worker:
  in-hands:
  in-ci:
  scenario:
  # Each member's scenario (e2e/pilotsim/cmd/aicrew-simclient, scenario),
  # which only the runner writes.
  scenario-coordinator:
  scenario-worker:
