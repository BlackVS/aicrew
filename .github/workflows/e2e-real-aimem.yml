name: e2e (real aimem)

# The end-to-end harness against a real aimem (docs/E2E-REAL-AIMEM.md):
# nightly on main, by hand on any branch, and on a pull request that carries
# the label e2e-real-aimem (a release-preparation pull request does). It
# builds aimem from the commit the harness pins, so it is kept out of the
# ordinary pull-request run.
#
# A pull request event runs the job only while the label is on the pull
# request, and a labeled event only when that label is the one added, so
# another label on a labelled pull request starts no second run. Every
# other pull request event is skipped, under a concurrency group and a job
# name of its own. In the shared group its pending run would replace a real
# run queued behind a running one. Under the shared name its skipped check,
# newer than the real one at the same head (a hands label change after the
# run), would stand for it, and skipped counts as passing. GitHub does not
# evaluate a skipped job's name, so that check shows the expression text;
# evaluated or not, it is never "real-aimem".
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
    github.event_name == 'pull_request' &&
    !(contains(github.event.pull_request.labels.*.name, 'e2e-real-aimem') &&
    (github.event.action != 'labeled' || github.event.label.name == 'e2e-real-aimem')) &&
    format('-skipped-{0}', github.run_id) || '' }}
  cancel-in-progress: false

jobs:
  real-aimem:
    name: >-
      ${{ (github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'e2e-real-aimem') &&
      (github.event.action != 'labeled' || github.event.label.name == 'e2e-real-aimem')))
      && 'real-aimem' || 'real-aimem (not requested)' }}
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'e2e-real-aimem') &&
      (github.event.action != 'labeled' || github.event.label.name == 'e2e-real-aimem'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: aicrew
          persist-credentials: false
      # The whole history with its tags: the harness archives the pinned
      # commit and stamps the version `git describe` gives it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: BlackVS/aimem
          path: aimem
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: aicrew/go.sum
      - name: real-aimem harness
        working-directory: aicrew
        run: bash scripts/e2e-real-aimem.sh -aimem-src ../aimem -out ../e2e-out
      - name: keep the report and the logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-real-aimem
          path: e2e-out
          if-no-files-found: warn
          retention-days: 14
