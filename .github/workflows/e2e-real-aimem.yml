name: e2e (real aimem)

# The end-to-end harness against a real aimem (docs/E2E-REAL-AIMEM.md):
# nightly on main, and by hand on any branch (a release-preparation pull
# request runs it on its head). It builds aimem from the commit the harness
# pins, so it is kept out of the ordinary pull-request run.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-aimem:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: aicrew
          persist-credentials: false
      # The whole history with its tags: the harness archives the pinned
      # commit and stamps the version `git describe` gives it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: BlackVS/aimem
          path: aimem
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: aicrew/go.sum
      - name: real-aimem harness
        working-directory: aicrew
        run: bash scripts/e2e-real-aimem.sh -aimem-src ../aimem -out ../e2e-out
      - name: keep the report and the logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-real-aimem
          path: e2e-out
          if-no-files-found: warn
          retention-days: 14
