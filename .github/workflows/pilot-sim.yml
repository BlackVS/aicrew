name: pilot simulation

# The pilot simulation (docs/E2E-PILOT-SIM.md): nightly on main, by hand on
# any branch, and on a pull request that carries the label pilot-sim. The
# stack is too heavy for every push, so it is kept out of the ordinary
# pull-request run. Three jobs, each on a runner of its own: pilot-sim (the
# cycles and the cases), pilot-sim-upgrade (the upgrade scenario from the
# previous release, scripts/pilot-sim.sh -upgrade) and
# pilot-sim-upgrade-below-minimum (the same scenario from a home whose aimem
# is below this tree's minimum, -upgrade -below-minimum).
#
# The label gate is e2e-real-aimem.yml's: a pull request event runs the job
# only while the label is on the pull request, and a labeled event only
# when that label is the one added, so another label on a labelled pull
# request starts no second run. Every other pull request event runs only a
# step that says so, under a concurrency group and a job name of its own
# ("pilot-sim (not requested)"), so that its check never stands for a real
# run at the same head.
on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
    github.event_name == 'pull_request' &&
    !(contains(github.event.pull_request.labels.*.name, 'pilot-sim') &&
    (github.event.action != 'labeled' || github.event.label.name == 'pilot-sim')) &&
    format('-skipped-{0}', github.run_id) || '' }}
  # A new push to a pull request cancels the run for its older head, which
  # would otherwise hold the new head's run pending behind it. Only pull
  # request runs cancel: a run on main, a nightly run and a run by hand
  # have refs of their own and are never cancelled, and a skipped event's
  # group is its own run's, so it cancels nothing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pilot-sim:
    name: >-
      ${{ (github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'pilot-sim') &&
      (github.event.action != 'labeled' || github.event.label.name == 'pilot-sim')))
      && 'pilot-sim' || 'pilot-sim (not requested)' }}
    # No job-level if: GitHub does not evaluate the name of a job an if
    # skips, and its check run would show the expression's text. The job
    # always starts, so its name is always evaluated; when the simulation
    # is not requested it runs one step that says so, and its check is
    # "pilot-sim (not requested)", never a skipped "pilot-sim" that would
    # pass for one. REQUESTED is the name's condition.
    env:
      REQUESTED: >-
        ${{ github.event_name != 'pull_request' ||
        (contains(github.event.pull_request.labels.*.name, 'pilot-sim') &&
        (github.event.action != 'labeled' || github.event.label.name == 'pilot-sim')) }}
    runs-on: ubuntu-latest
    # The run's own bound (AICREW_SIM_BOUND_MINUTES, 90 by default) stops
    # it first and still writes the report; this is the backstop.
    timeout-minutes: 120
    steps:
      - name: not requested
        if: env.REQUESTED != 'true'
        run: echo "pilot-sim was not requested for this event (label pilot-sim); nothing runs"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.REQUESTED == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.REQUESTED == 'true'
        with:
          go-version: '1.25'
          cache: true
      - name: pilot simulation
        if: env.REQUESTED == 'true'
        run: bash scripts/pilot-sim.sh -out "$RUNNER_TEMP/pilotsim"
      - name: the report's summary
        if: always() && env.REQUESTED == 'true'
        run: tail -n 1 "$RUNNER_TEMP/pilotsim/report.jsonl" || echo "no report"
      # The report, the step snapshots, the containers' logs and the member
      # homes. Left out: the staged binaries and image contexts, and the
      # run's known secrets, which a run cut off by the job's timeout
      # leaves behind.
      - name: keep the report and the logs
        if: always() && env.REQUESTED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pilot-sim
          path: |
            ${{ runner.temp }}/pilotsim
            !${{ runner.temp }}/pilotsim/stage
            !${{ runner.temp }}/pilotsim/.known
          if-no-files-found: warn
          retention-days: 14

  pilot-sim-upgrade:
    name: >-
      ${{ (github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'pilot-sim') &&
      (github.event.action != 'labeled' || github.event.label.name == 'pilot-sim')))
      && 'pilot-sim-upgrade' || 'pilot-sim-upgrade (not requested)' }}
    # The pattern of pilot-sim above: no job-level if, REQUESTED is the
    # name's condition, and every step but the first is gated by it.
    env:
      REQUESTED: >-
        ${{ github.event_name != 'pull_request' ||
        (contains(github.event.pull_request.labels.*.name, 'pilot-sim') &&
        (github.event.action != 'labeled' || github.event.label.name == 'pilot-sim')) }}
      AICREW_SIM_BOUND_MINUTES: '30'
    runs-on: ubuntu-latest
    # The run's own bound (30 minutes, above) stops it first and still
    # writes the report; this is the backstop.
    timeout-minutes: 45
    steps:
      - name: not requested
        if: env.REQUESTED != 'true'
        run: echo "pilot-sim-upgrade was not requested for this event (label pilot-sim); nothing runs"
      # The whole history with its tags: the previous release is the newest
      # release tag merged into HEAD and not on HEAD (e2e/pilotsim/cmd/simupgrade).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.REQUESTED == 'true'
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.REQUESTED == 'true'
        with:
          go-version: '1.25'
          cache: true
      - name: the upgrade scenario
        if: env.REQUESTED == 'true'
        run: bash scripts/pilot-sim.sh -upgrade -out "$RUNNER_TEMP/pilotsim-upgrade"
      - name: the report's summary
        if: always() && env.REQUESTED == 'true'
        run: tail -n 1 "$RUNNER_TEMP/pilotsim-upgrade/report.jsonl" || echo "no report"
      - name: keep the report and the logs
        if: always() && env.REQUESTED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pilot-sim-upgrade
          path: |
            ${{ runner.temp }}/pilotsim-upgrade
            !${{ runner.temp }}/pilotsim-upgrade/stage
            !${{ runner.temp }}/pilotsim-upgrade/.known
          if-no-files-found: warn
          retention-days: 14

  pilot-sim-upgrade-below-minimum:
    name: >-
      ${{ (github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'pilot-sim') &&
      (github.event.action != 'labeled' || github.event.label.name == 'pilot-sim')))
      && 'pilot-sim-upgrade-below-minimum' || 'pilot-sim-upgrade-below-minimum (not requested)' }}
    # The pattern of pilot-sim above: no job-level if, REQUESTED is the
    # name's condition, and every step but the first is gated by it.
    env:
      REQUESTED: >-
        ${{ github.event_name != 'pull_request' ||
        (contains(github.event.pull_request.labels.*.name, 'pilot-sim') &&
        (github.event.action != 'labeled' || github.event.label.name == 'pilot-sim')) }}
      AICREW_SIM_BOUND_MINUTES: '30'
    runs-on: ubuntu-latest
    # The run's own bound (30 minutes, above) stops it first and still
    # writes the report; this is the backstop.
    timeout-minutes: 45
    steps:
      - name: not requested
        if: env.REQUESTED != 'true'
        run: echo "pilot-sim-upgrade-below-minimum was not requested for this event (label pilot-sim); nothing runs"
      # The start is the pinned pair of `simupgrade below-minimum`; the
      # history is fetched whole as in pilot-sim-upgrade.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.REQUESTED == 'true'
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.REQUESTED == 'true'
        with:
          go-version: '1.25'
          cache: true
      - name: the upgrade scenario from aimem below the minimum
        if: env.REQUESTED == 'true'
        run: bash scripts/pilot-sim.sh -upgrade -below-minimum -out "$RUNNER_TEMP/pilotsim-upgrade"
      - name: the report's summary
        if: always() && env.REQUESTED == 'true'
        run: tail -n 1 "$RUNNER_TEMP/pilotsim-upgrade/report.jsonl" || echo "no report"
      - name: keep the report and the logs
        if: always() && env.REQUESTED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pilot-sim-upgrade-below-minimum
          path: |
            ${{ runner.temp }}/pilotsim-upgrade
            !${{ runner.temp }}/pilotsim-upgrade/stage
            !${{ runner.temp }}/pilotsim-upgrade/.known
          if-no-files-found: warn
          retention-days: 14
