name: e2e (real aimem)

# The end-to-end harness against a real aimem (docs/E2E-REAL-AIMEM.md):
# nightly on main, by hand on any branch, and on a pull request that carries
# the label e2e-real-aimem (a release-preparation pull request does). It
# builds aimem from the commit the harness pins, so it is kept out of the
# ordinary pull-request run.
#
# A pull request event runs the job only while the label is on the pull
# request, and a labeled event only when that label is the one added, so
# another label on a labelled pull request starts no second run. Every
# other pull request event runs only a step that says so, under a
# concurrency group and a job name of its own. In the shared group its
# pending run would replace a real run queued behind a running one. Under
# the shared name its check, newer than the real one at the same head (a
# hands label change after the run), would stand for it. The job has no
# job-level if: GitHub does not evaluate the name of a job an if skips, and
# its check would show the expression's text. So the job always starts and
# its check is "real-aimem (not requested)", never "real-aimem".
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
    github.event_name == 'pull_request' &&
    !(contains(github.event.pull_request.labels.*.name, 'e2e-real-aimem') &&
    (github.event.action != 'labeled' || github.event.label.name == 'e2e-real-aimem')) &&
    format('-skipped-{0}', github.run_id) || '' }}
  # A new push to a pull request cancels the run for its older head, which
  # would otherwise hold the new head's run pending behind it. Only pull
  # request runs cancel: a run on main, a nightly run and a run by hand
  # have refs of their own and are never cancelled, and a skipped event's
  # group is its own run's, so it cancels nothing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  real-aimem:
    name: >-
      ${{ (github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'e2e-real-aimem') &&
      (github.event.action != 'labeled' || github.event.label.name == 'e2e-real-aimem')))
      && 'real-aimem' || 'real-aimem (not requested)' }}
    # REQUESTED is the name's condition; every step but the first runs only
    # when it holds.
    env:
      REQUESTED: >-
        ${{ github.event_name != 'pull_request' ||
        (contains(github.event.pull_request.labels.*.name, 'e2e-real-aimem') &&
        (github.event.action != 'labeled' || github.event.label.name == 'e2e-real-aimem')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: not requested
        if: env.REQUESTED != 'true'
        run: echo "real-aimem was not requested for this event (label e2e-real-aimem); nothing runs"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.REQUESTED == 'true'
        with:
          path: aicrew
          persist-credentials: false
      # The whole history with its tags: the harness archives the pinned
      # commit and stamps the version `git describe` gives it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.REQUESTED == 'true'
        with:
          repository: BlackVS/aimem
          path: aimem
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: env.REQUESTED == 'true'
        with:
          go-version: '1.26'
          cache-dependency-path: aicrew/go.sum
      - name: real-aimem harness
        if: env.REQUESTED == 'true'
        working-directory: aicrew
        run: bash scripts/e2e-real-aimem.sh -aimem-src ../aimem -out ../e2e-out
      - name: keep the report and the logs
        if: always() && env.REQUESTED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-real-aimem
          path: e2e-out
          if-no-files-found: warn
          retention-days: 14
