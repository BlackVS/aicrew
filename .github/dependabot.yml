version: 2
updates:
  # Every action in .github/workflows is pinned by a full commit SHA with
  # its version in a comment; dependabot updates the pins in that form.
  # One group: the actions' updates of a week arrive as one pull request
  # (actions released together, such as upload-artifact and
  # download-artifact, are then reviewed and merged together); its review
  # still checks the 7-day rule for each action in it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
